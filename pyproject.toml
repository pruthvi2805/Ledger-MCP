[tool.poetry]
name = "ledger-mcp"
version = "0.1.0"
description = "Local-first AI personal finance manager. Universal CSV/PDF import, global currency support, and privacy-first MCP integration."
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = "^0.9.0"}
mcp = "^1.0.0"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pdfplumber = "^0.10.0"
pandas = "^2.2.0"
cryptography = "^42.0.0"
jinja2 = "^3.1.0"
python-multipart = "^0.0.9"
reportlab = "^4.0.0"
matplotlib = "^3.8.0"

[tool.poetry.scripts]
ledger = "ledger_mcp.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
